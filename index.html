<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Island Snow — Bootstrap 5 WOD</title>

    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />

    <!-- Bootstrap Icons -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"
    />

    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>

    <!-- Top Menubar -->
    <nav class="navbar bg-light border-bottom" aria-label="Top nav">
      <div class="container">
        <!-- Left icon list -->
        <ul class="nav align-items-center">
          <li class="nav-item p-1">
            <a class="nav-link link-dark" href="#store"><i class="bi bi-geo-alt"></i></a>
          </li>
          <li class="nav-item p-1">
            <a class="nav-link link-dark" href="#contact"><i class="bi bi-telephone"></i></a>
          </li>
          <li class="nav-item p-1">
            <a class="nav-link link-dark" href="#email"><i class="bi bi-envelope"></i></a>
          </li>
        </ul>

        <!-- Right icon list -->
        <ul class="nav justify-content-end align-items-center ms-auto">
          <li class="nav-item p-1">
            <a class="nav-link link-dark" href="#search" aria-label="Search"><i class="bi bi-search"></i></a>
          </li>
          <li class="nav-item p-1">
            <a class="nav-link link-dark" href="#signin" aria-label="Sign in"><i class="bi bi-person"></i></a>
          </li>

          <!-- My Cart dropdown -->
          <li class="nav-item dropdown p-1">
            <a
              class="nav-link dropdown-toggle link-dark d-flex align-items-center"
              href="#"
              id="cartDropdown"
              role="button"
              data-bs-toggle="dropdown"
              aria-expanded="false"
            >
              <i class="bi bi-bag me-1"></i> My Cart
            </a>
            <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="cartDropdown">
              <li><span class="dropdown-item-text text-muted">Your cart is empty.</span></li>
              <li><hr class="dropdown-divider" /></li>
              <li><a class="dropdown-item" href="#checkout">Go to Checkout</a></li>
            </ul>
          </li>
        </ul>
      </div>
    </nav>

    <!-- Primary navbar (site sections) -->
    <nav class="navbar navbar-expand-md bg-light" aria-label="Primary">
      <div class="container">
        <a class="navbar-brand fw-bold" href="#top">ISLAND SNOW</a>

        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#primaryNav"
          aria-controls="primaryNav"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="primaryNav">
          <ul class="navbar-nav ms-auto mb-2 mb-md-0">
            <li class="nav-item"><a class="nav-link" href="#men">Men</a></li>
            <li class="nav-item"><a class="nav-link" href="#women">Women</a></li>
            <li class="nav-item"><a class="nav-link" href="#kids">Kids</a></li>
            <li class="nav-item"><a class="nav-link" href="#brands">Brands</a></li>
            <li class="nav-item"><a class="nav-link" href="#sale">Sale</a></li>
          </ul>
        </div>
      </div>
    </nav>

    <!-- Placeholder anchors so links work in WOD 1 -->
    <main class="container py-5">
      <section id="men" class="py-3"><h2 class="h5">Men</h2><p>…</p></section>
      <section id="women" class="py-3"><h2 class="h5">Women</h2><p>…</p></section>
      <section id="kids" class="py-3"><h2 class="h5">Kids</h2><p>…</p></section>
      <section id="brands" class="py-3"><h2 class="h5">Brands</h2><p>…</p></section>
      <section id="sale" class="py-3"><h2 class="h5">Sale</h2><p>…</p></section>
    </main>

    <!-- Bootstrap JS Bundle -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
