<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Island Snow</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" />
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" />
    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css" />
  </head>

  <body class="bg-light">

    <!-- ===== Top thin bar ===== -->
    <nav class="navbar bg-white border-bottom py-1 small">
      <div class="container d-flex justify-content-between align-items-center">

        <!-- Left: social icons -->
        <ul class="nav">
          <li class="nav-item"><a class="nav-link link-dark p-1" href="#"><i class="bi bi-facebook"></i></a></li>
          <li class="nav-item"><a class="nav-link link-dark p-1" href="#"><i class="bi bi-twitter"></i></a></li>
          <li class="nav-item"><a class="nav-link link-dark p-1" href="#"><i class="bi bi-pinterest"></i></a></li>
          <li class="nav-item"><a class="nav-link link-dark p-1" href="#"><i class="bi bi-instagram"></i></a></li>
        </ul>

        <!-- Right: utilities -->
        <ul class="nav">
          <li class="nav-item"><a class="nav-link link-dark p-1" href="#"><i class="bi bi-search"></i></a></li>
          <li class="nav-item"><a class="nav-link link-dark p-1" href="#"><i class="bi bi-person"></i></a></li>
          <li class="nav-item"><a class="nav-link link-dark p-1" href="#"><i class="bi bi-heart"></i></a></li>
          <li class="nav-item dropdown">
            <a class="nav-link link-dark p-1 dropdown-toggle" href="#" id="cartDropdown" role="button" data-bs-toggle="dropdown" aria-expanded="false">
              <i class="bi bi-bag"></i>
            </a>
            <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="cartDropdown">
              <li><span class="dropdown-item-text text-muted">Your cart is empty.</span></li>
              <li><hr class="dropdown-divider" /></li>
              <li><a class="dropdown-item" href="#">Go to Checkout</a></li>
            </ul>
          </li>
        </ul>

      </div>
    </nav>

    <!-- ===== Centered logo ===== -->
    <div class="bg-white">
      <div class="container py-3">
        <img
          src="experience-islandsnow-bootstrap-logo.png"
          alt="Island Snow"
          class="img-fluid d-block mx-auto"
          style="max-height:80px"
        />
      </div>
    </div>

    <!-- ===== Main menu row ===== -->
    <nav class="navbar bg-white border-top border-bottom py-2">
      <div class="container justify-content-center">
        <ul class="nav text-uppercase fw-semibold menu-tight">
          <li class="nav-item"><a class="nav-link link-dark px-3" href="#men">Men</a></li>
          <li class="nav-item"><a class="nav-link link-dark px-3" href="#women">Women</a></li>
          <li class="nav-item">
            <a class="nav-link link-dark px-3" href="#kids">Kids <i class="bi bi-caret-down-fill small"></i></a>
          </li>
        <li class="nav-item">
            <a class="nav-link link-dark px-3" href="#brands">Brands <i class="bi bi-caret-down-fill small"></i></a>
          </li>
          <li class="nav-item"><a class="nav-link link-dark px-3" href="#search">Search</a></li>
        </ul>
      </div>
    </nav>

    <!-- ===== Hero image ===== -->
    <div class="container my-3">
      <img
        src="experience-islandsnow-bootstrap-main.png"
        alt="Model sitting on a bridge wearing Island Snow apparel"
        class="img-fluid w-100"
      />
    </div>

    <!-- ===== Footer ===== -->
    <footer class="mt-4 pt-4 pb-4 text-white" style="background-color:#292929;">
      <div class="container">
        <div class="row g-4">
          <div class="col-12 col-md-4">
            <h6 class="text-uppercase mb-2">Navigation</h6>
            <hr class="border-light opacity-50 my-2" />
            <ul class="list-unstyled small mb-0 opacity-75">
              <li><a class="link-light link-underline-opacity-0" href="#">About Us</a></li>
              <li><a class="link-light link-underline-opacity-0" href="#">Employment</a></li>
              <li><a class="link-light link-underline-opacity-0" href="#">Videos</a></li>
            </ul>
          </div>

          <div class="col-12 col-md-4">
            <h6 class="text-uppercase mb-2">Main Menu</h6>
            <hr class="border-light opacity-50 my-2" />
            <ul class="list-unstyled small mb-0 opacity-75">
              <li><a class="link-light link-underline-opacity-0" href="#men">Men</a></li>
              <li><a class="link-light link-underline-opacity-0" href="#women">Women</a></li>
              <li><a class="link-light link-underline-opacity-0" href="#kids">Kids</a></li>
            </ul>
          </div>

          <div class="col-12 col-md-4">
            <h6 class="text-uppercase mb-2">Connect</h6>
            <hr class="border-light opacity-50 my-2" />
            <form class="d-flex gap-2" action="#" method="post" novalidate>
              <input type="text" class="form-control form-control-sm" placeholder="Enter Email Address" aria-label="Email" />
              <button type="submit" class="btn btn-dark btn-sm">Join</button>
            </form>
          </div>
        </div>
      </div>
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
